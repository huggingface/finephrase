# Rephrasing benchmark experiment configuration
experiment_name: "rephrase_budget-20-prompt"
script: "rephrase"
continue_on_failure: true

# Fixed arguments that apply to all runs
fixed_args:
  # Data and output configuration
  data_paths: "s3://finephrase/experiments/filtered/fineweb-edu-lq-20BT"
  limit: -1
  
  # Processing configuration
  n_tasks: 2
  gpus: 1 # It seems dp on multiple gpus is not working
  tp: 1
  enable_prefix_caching: true
  enable_chunked_prefill: true

  # Model configuration 
  # TODO adapt rephrase script to allow for system and user prompts
  prompt: "dspy/5-max_full_evals.md"  # Adjust prompt as needed
  max_tokens: 4096
  model_max_context: 16384

  temperature: 1
  top_p: 0.95
  top_k: 64
  presence_penalty: 1.5
  
  # Infrastructure configuration
  max_concurrent_requests: 500
  max_concurrent_tasks: 500
  server_type: "vllm"
  
  # Debugging and checkpoints
  debug: false # Logs get very verbose when debug is true
  tokenizer: "hynky/Llama-3.2-1B-no-bos"
  
  # Slurm configuration
  time: "23:00:00"
  partition: "hopper-prod"
  qos: "normal"

# Variable arguments - creates different experiment runs
runs:
  - name: "gemma_3_270m_it"
    args:
      model_name_or_path: "google/gemma-3-270m-it"
  - name: "gemma_3_27b_it"
    args:
      model_name_or_path: "google/gemma-3-27b-it"

