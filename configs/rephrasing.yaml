# Rephrasing benchmark experiment configuration
script: "rephrase"
continue_on_failure: true

# IMPORTANT: This is a large run, make sure to inform people in #science-cluster-planning beforehand.

# Fixed arguments for all runs
fixed_args:
  # Data and output configuration
  data-paths: "s3://finephrase/experiments/filtered/fineweb-edu-lq-20BT"
  limit: -1
  
  # Processing configuration
  enable-prefix-caching: true
  enable-chunked-prefill: true

  # Model configuration 
  max-tokens: 4096
  model-max-context: 16384

  temperature: 1
  top-p: 0.95
  top-k: 64
  
  # Infrastructure configuration
  max-concurrent-requests: 500
  max-concurrent-tasks: 500
  server-type: "vllm"
  
  # This seems to be a middle ground that works well across models and has a high draft acceptance rate of around 0.7
  # Decreasing the temperature could lead to a higher draft acceptance rate, but diversity could suffer
  speculative-config: '{"method": "ngram", "num_speculative_tokens": 7, "prompt_lookup_max": 6}'
  
  # Debugging and checkpoints
  debug: false # Logs get very verbose when debug is true
  
  # Slurm configuration
  time: "3-00:00:00"
  qos: "normal"
  n-tasks: 1 # The input dataset has 10K chunks, so we cannot run more tasks (2M tokens per file)
  n-workers: 16 # Only limit the number of workers if you are running in qos normal

# There is usually more input tokens than output tokens
# 27B (tp4): ~4.5M output tokens per hour 
# 12B (tp2): ~3.6M output tokens per hour 
# 4B (tp1): ~7.2M output tokens per hour
# 1B (tp1): ~33.2M output tokens per hour 
# 270M (tp1): ~62.4M output tokens per hour

