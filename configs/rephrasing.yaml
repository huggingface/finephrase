# Rephrasing experiment configuration
script: "rephrase"
continue_on_failure: true

# IMPORTANT: This is a large run, make sure to inform team members beforehand.

# Fixed arguments for all runs
fixed_args:
  # Data and output configuration
  data: "s3://finephrase/experiments/filtered/fineweb-edu-lq-20BT"
  limit: -1

  # Processing configuration
  enable-prefix-caching: false # prefix caching is not compatible with sliding window attention
  enable-chunked-prefill: false # This is apparently mainly useful for latency improvements

  # Model configuration
  max-tokens: 4096
  model-max-context: 16384

  tp: 1
  gpu-memory-utilization: 0.88

  # Infrastructure configuration
  max-concurrent-requests: 500
  max-concurrent-tasks: 500
  server-type: "vllm"

  # This seems to be a middle ground that works well across models and has a high draft acceptance rate of around 0.7
  # Decreasing the temperature could lead to a higher draft acceptance rate, but diversity could suffer
  speculative-config: '{"method": "ngram", "num_speculative_tokens": 7, "prompt_lookup_max": 6}'

  # Debugging and checkpoints
  debug: false # Logs get very verbose when debug is true

  # Slurm configuration
  time: "7-00:00:00"
  qos: "low"
  n-tasks: 100
  #n-workers: 20 # Only need to limit the number of workers if you are running in qos normal
  #override-unsafe: true # Overrides unsafe guard for large runs

